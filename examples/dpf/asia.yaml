apiVersion: v1
kind: Namespace
metadata:
  name: tenant-asia
  labels:
    training.dpf.nvidia.com/tenant: asia
---
apiVersion: provisioning.dpu.nvidia.com/v1alpha1
kind: DPUCluster
metadata:
  name: tenant-asia
  namespace: tenant-asia
  labels:
    training.dpf.nvidia.com/tenant: asia
spec:
  type: kamaji
  maxNodes: 1000
  clusterEndpoint:
    keepalived:
      interface: enp7s0
      vip: 192.0.2.203
      virtualRouterID: 127
      nodeSelector:
        node-role.kubernetes.io/control-plane: ''
